{% extends "base.html" %}

{% block content %}

<section class="checkout">

    <h1>

        <i class="bi bi-plus-square"></i>

        Add New Dish

    </h1>

    <form action="/save_dish" method="POST">

        <label>

            Dish Name

        </label>

        <input
            type="text"
            name="dish_name"
            placeholder="Enter dish name"
            required
        >

        <label>

            Category

        </label>

        <input
            type="text"
            name="category"
            placeholder="Enter category"
            required
        >

        <label>

            Price

        </label>

        <input
            type="number"
            name="price"
            placeholder="Enter price"
            required
        >

        <label>

            Description

        </label>

        <textarea
            name="description"
            rows="4"
            placeholder="Enter dish description"
        ></textarea>

        <label>

            Image File Name

        </label>

        <input
            type="text"
            name="image"
            placeholder="example: paneer_butter_masala.jpeg"
            required
        >

        <button type="submit">

            <i class="bi bi-check-lg"></i>

            Save Dish

        </button>

    </form>

</section>

{% endblock %}
