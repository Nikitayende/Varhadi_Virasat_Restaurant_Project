{% extends "base.html" %}

{% block title %}

Edit Dish | Varhadi Virasat

{% endblock %}

{% block content %}

<section class="checkout">

    <h1>

        <i class="bi bi-pencil-fill"></i>

        Edit Dish

    </h1>

    <form action="/update_dish/{{ item.id }}" method="POST">

        <label>

            Dish Name

        </label>

        <input
            type="text"
            name="dish_name"
            value="{{ item.dish_name }}"
            required
        >

        <label>

            Category

        </label>

        <input
            type="text"
            name="category"
            value="{{ item.category }}"
            required
        >

        <label>

            Price

        </label>

        <input
            type="number"
            step="0.01"
            name="price"
            value="{{ item.price }}"
            required
        >

        <label>

            Description

        </label>

        <textarea
            name="description"
            rows="4"
        >{{ item.description }}</textarea>

        <label>

            Image File Name

        </label>

        <input
            type="text"
            name="image"
            value="{{ item.image }}"
            required
        >

        <button type="submit">

            <i class="bi bi-check2-circle"></i>

            Update Dish

        </button>

    </form>

</section>

{% endblock %}
